name: Deploy Meridian Bot to AWS

# =====================================================================
# MERIDIAN INSTITUTIONAL GOVERNANCE — NEXUS-000B DEPLOYMENT INTERLOCK
# =====================================================================
# REGRA VITAL: CI VERDE != AUTORIZACAO DE PRODUCAO
#
# Este workflow está estritamente desacoplado do pipeline de CI.
# Gatilhos automáticos (workflow_run, push, pull_request) foram abolidos.
#
# REQUISITOS DE DISPARO:
# 1. Disparo manual explícito via workflow_dispatch.
# 2. Confirmação obrigatória: 'DEPLOY-TO-PRODUCTION'.
# 3. Referência formal de diretiva/autorização obrigatória.
# 4. Vinculação ao GitHub Environment 'production'.
# 5. Fail-closed: Ausência de autorização ou secrets aborta com exit 1.
#
# MANUAL CONTROL REQUIRED:
# Para governança completa em nível de plataforma GitHub, Victor deve
# configurar em Settings -> Environments -> production:
#   1. Required reviewers: Adicionar Victor como revisor obrigatório.
#   2. Deployment branches: Restringir exclusivamente para a branch 'main'.
# =====================================================================

"on":
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirmação mandatória (digite EXATAMENTE 'DEPLOY-TO-PRODUCTION'):"
        required: true
        type: string
      nexus_directive_ref:
        description: "Referência formal da Diretiva / Autorização Executiva (ex: NEXUS-001 / ASTRA-001):"
        required: true
        type: string
      environment:
        description: "Ambiente de destino:"
        required: true
        type: choice
        options:
          - production
        default: production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS Production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirmation == 'DEPLOY-TO-PRODUCTION' }}

    steps:
    - name: Validate explicit executive authorization
      id: auth_gate
      run: |
        echo "=== MERIDIAN DEPLOYMENT INTERLOCK GATE ==="
        echo "Invocado por: ${{ github.actor }}"
        echo "Referência de Autorização: ${{ github.event.inputs.nexus_directive_ref }}"
        echo "Ambiente Alvo: ${{ github.event.inputs.environment }}"

        if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-TO-PRODUCTION" ]; then
          echo "::error::Confirmação de produção inválida. Esperado: 'DEPLOY-TO-PRODUCTION'."
          exit 1
        fi

        if [ -z "${{ github.event.inputs.nexus_directive_ref }}" ]; then
          echo "::error::Referência de diretiva formal obrigatória ausente."
          exit 1
        fi

        echo "Autorização executiva validada com sucesso."

    - name: Check deploy secrets configured
      id: check
      run: |
        if [ -n "$SERVER_IP" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Deploy secrets detectados."
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::SERVER_IP ou SSH_PRIVATE_KEY ausentes em Settings > Secrets. Abortando (fail-closed)."
          exit 1
        fi
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key.pem
        chmod 600 ~/.ssh/deploy_key.pem
        ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}

    - name: Copy files to AWS
      run: |
        rsync -avz --delete --exclude '.git' --exclude '.github' --exclude 'infra' --exclude '.env' --exclude '.agents' --exclude '.pytest_cache' --exclude '__pycache__' --exclude 'node_modules' --exclude 'data/*.db*' --exclude 'logs' -e "ssh -i ~/.ssh/deploy_key.pem" ./ ubuntu@$SERVER_IP:/app/Meridian/
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}

    - name: Inject Secrets & Restart Docker
      run: |
        ssh -i ~/.ssh/deploy_key.pem ubuntu@$SERVER_IP << 'EOF'
          cd /app/Meridian
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "EMERGENCY_PASSWORD=${{ secrets.EMERGENCY_PASSWORD }}" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env
          sudo docker-compose down
          sudo docker-compose build
          sudo docker-compose up -d
        EOF
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
