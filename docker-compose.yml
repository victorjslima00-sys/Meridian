version: "3.8"

services:
  # Container 1: O Bot de Paper Trading (cron)
  bot:
    build: .
    container_name: meridian_bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data      # Persiste o banco SQLite
      - ./logs:/app/logs      # Persiste os logs do Python
      - ./.env:/app/.env:ro   # Mapeia o .env como read-only
    env_file:
      - .env

  # Container 2: A API FastAPI (backend do dashboard)
  api:
    build: .
    container_name: meridian_api
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - bot

  # Container 3: O Frontend React (pre-built multi-stage image servida via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meridian_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
