version: "3.8"

services:
  # Container 1: Legacy Paper Trading Bot (desabilitado do runtime padrao - NEXUS-004)
  # Apenas uma autoridade de execucao e permitida: a moderna via backend.app.main
  bot:
    build: .
    container_name: meridian_bot
    restart: "no"
    profiles:
      - legacy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    env_file:
      - .env

  # Container 2: A API FastAPI (backend com o loop moderno de execucao supervisionada)
  api:
    build: .
    container_name: meridian_api
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  # Container 3: O Frontend React (buildado e servido via nginx)
  frontend:
    image: node:20-alpine
    container_name: meridian_frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - api
